version: "3"

env:
  CARGO_TERM_COLOR: always
  LIBJXL_SYS_DIR: "D:/1VSCODE/Projects/ImageAll/Trimg/target/libjxl-prebuilt"

tasks:
  build:
    desc: Build CLI and GUI (debug)
    cmds:
      - cargo build --workspace
      - cargo build --manifest-path gui/src-tauri/Cargo.toml

  build-release:
    desc: Build CLI and GUI (release, requires vcvars)
    cmds:
      - scripts\\build-release.cmd

  check:
    desc: Type-check all code without linking
    cmds:
      - cargo check --workspace
      - cargo check --manifest-path gui/src-tauri/Cargo.toml

  test:
    desc: Run all tests
    cmds:
      - cargo test --workspace
      - cargo test --manifest-path gui/src-tauri/Cargo.toml

  dev:
    desc: Start Tauri dev server (GUI hot-reload)
    dir: gui
    cmds:
      - bun install
      - bun tauri dev

  dev-frontend:
    desc: Start Vite dev server only (no Rust backend)
    dir: gui
    cmds:
      - bun install
      - bun dev

  clean:
    desc: Remove build artifacts
    cmds:
      - cargo clean
      - powershell -Command 'Remove-Item -Recurse -Force gui/src-tauri/target -ErrorAction SilentlyContinue'

  setup:
    desc: One-time MSVC PATH setup (run once after clone)
    cmds:
      - powershell -File scripts/setup.ps1

  gui:version:
    desc: Show current GUI version
    cmds:
      - echo "package.json:"
      - powershell -Command "(Get-Content gui/package.json | ConvertFrom-Json).version"
      - echo "Cargo.toml:"
      - powershell -Command "(Get-Content gui/src-tauri/Cargo.toml | Select-String '^version').Line"
      - echo "tauri.conf.json:"
      - powershell -Command "(Get-Content gui/src-tauri/tauri.conf.json | ConvertFrom-Json).version"

  gui:bump:
    desc: Bump GUI version (usage - task gui:bump -- 0.2.0)
    cmds:
      - powershell -File scripts/bump-version.ps1 {{.CLI_ARGS}}

  tag:list:
    desc: List all GUI-related tags
    cmds:
      - git tag -l "gui-*" --sort=-version:refname

  tag:create:
    desc: Create GUI version tag (usage - task tag:create -- 0.2.0)
    cmds:
      - powershell -File scripts/create-tag.ps1 {{.CLI_ARGS}}

  tag:push:
    desc: Push GUI tags to remote
    cmds:
      - git push origin --tags

  tag:delete:
    desc: Delete local GUI tag (usage - task tag:delete -- 0.2.0)
    cmds:
      - powershell -File scripts/delete-tag.ps1 {{.CLI_ARGS}}

  gui:release:
    desc: Full GUI release workflow (usage - task gui:release -- 0.2.0)
    cmds:
      - task: gui:bump
        vars:
          CLI_ARGS: '{{.CLI_ARGS}}'
      - task: tag:create
        vars:
          CLI_ARGS: '{{.CLI_ARGS}}'
      - powershell -File scripts/release-summary.ps1 {{.CLI_ARGS}}
