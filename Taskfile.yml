version: "3"

env:
  CARGO_TERM_COLOR: always

tasks:
  build:
    desc: Build CLI and GUI
    cmds:
      - build_msvc.bat build

  check:
    desc: Type-check all code without linking
    cmds:
      - build_msvc.bat check

  test:
    desc: Run all tests
    cmds:
      - build_msvc.bat test

  all:
    desc: Full CI pass (build + test)
    cmds:
      - build_msvc.bat all

  dev:
    desc: Start Tauri dev server (GUI hot-reload)
    cmds:
      - bun install --cwd gui
      - cmd /c dev.cmd

  dev-frontend:
    desc: Start Vite dev server only (no Rust backend)
    dir: gui
    cmds:
      - bun install
      - bun dev

  clean:
    desc: Remove build artifacts
    cmds:
      - cargo clean
      - powershell -Command 'Remove-Item -Recurse -Force gui/src-tauri/target -ErrorAction SilentlyContinue'
